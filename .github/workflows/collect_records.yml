name: Collect records

# Collects every capsule of every Dandiset repository of the organization into records/, with
# `dandi-validations collect` from https://github.com/dandi-validations/dandi-validations:
#   records/capsules.tsv   one row per Dandiset and dandi-validation image
#   records/capsules.json  the description of its columns

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  Collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install DANDI Validations
        run: python -m pip install "dandi-validations @ git+https://github.com/dandi-validations/dandi-validations@main"

      - name: Collect the records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dandi-validations collect --output records

      - name: Commit the records
        run: |
          set -euo pipefail
          git add records
          if git diff --cached --quiet; then
            echo "No changes to the records."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect validation records"
          git push
